const rounds=[
{name:'情境選擇',eng:'Choose a helpful step',intro:'遇到小困難，先照顧心情，再選一個有幫助的做法。',questions:[
{emoji:'🏀',en:'I missed the shot.',zh:'體育課投籃沒進，我有點失望。',choices:[['I can try again.','我可以再試一次。'],['I must not feel sad.','我不能難過。'],['I will never play again.','我再也不要打球了。']],good:0,why:'失望是正常的。可以先休息，再練習一次；不用把難過藏起來。'},

{name:'想法轉個彎',eng:'Grow your thinking',intro:'把「永遠不行」換成「還在學習」。選一句能幫自己往前走的話。',questions:[

{emoji:'🎨',en:'My picture is not good.',zh:'「我的畫不夠好。」怎麼給自己一點力量？',choices:[['I must be the best.','我一定要是最棒的。'],['I can learn and practice.','我可以學習和練習。'],['I have no talent.','我沒有天分。']],good:1,why:'每個人學習的速度不同。你可以挑一個小地方練習，不需要和別人比。'},

let stage=-1,q=0,score=0,energy=0,sound=false,answered=false,missed=false,ac;const app=document.getElementById('app');
function tone(ok){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();[ok?523:330,ok?659:392,ok?784:440].forEach((f,i)=>{let o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.09;o.connect(g);g.connect(ac.destination);o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.start(t);o.stop(t+.17)})}catch(e){}}
document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'音效：開 🔊':'音效：關 🔇';document.getElementById('sound').setAttribute('aria-pressed',sound);if(sound)tone(true)};
document.getElementById('restart').onclick=bubbleIntro;
function home(){stopBubbles();stage=-1;q=score=energy=0;app.innerHTML=`<div class="hero"><section><div class="eyebrow">GRADE 4 · 中英雙語冒險</div><h1>小小想法，<br>大大能量！</h1><p class="sub">Welcome to Positive Thinking Island!<br>和小芽一起探索：認識心情、找人幫忙、再試一次。<br>正向思考，也可以有難過的時候。</p><button class="primary" id="start">開始冒險 Let's go! →</button><p class="sub" style="font-size:13px">3 關 · 9 個生活小挑戰 · 約 8–12 分鐘<br>三關無時間限制 · 通關後解鎖 30 秒戳泡泡</p></section><div class="art" aria-label="小芽站在綠色能量島上"><div class="sun">☀️</div><div class="cloud">☁️</div><div class="island"></div><div class="buddy"><span class="sprout">🌱</span>•‿•</div><div class="sticker">It's okay to feel. 💛</div></div></div><div class="cards">${rounds.map((r,i)=>`<div class="card"><div class="icon">${['🧭','🌱','✨'][i]}</div><h3>0${i+1} ${r.name}</h3><p>${r.eng}<br>${['選擇照顧自己的下一步','把「不行」換成「還在學」','收集能帶回生活的小方法'][i]}</p></div>`).join('')}</div><div class="note">💛 <b>所有情緒都可以被接住。</b> 遊戲分數獎勵的是學習與嘗試，不是在評分你的心情。答錯可以再試，不扣分。</div><details class="teacher"><summary>給老師的小提醒</summary><p>建議全班先說說情境中的感受，再一起選答案；平板可個別操作。每題首次答對得 10 分，提示後答對得 5 分，最高 90 分。第三關每完成一題獲得一顆能量。最後請孩子說出一位可以求助的大人。若孩子分享困擾，先傾聽，不要求立刻變開心。</p></details>`;document.getElementById('start').onclick=()=>{stage=0;q=0;render()}}
function render(){answered=missed=false;const r=rounds[stage],item=r.questions[q];app.innerHTML=`<div class="topline"><div><div class="eyebrow">LEVEL 0${stage+1} / 03</div><h2>${r.name} <span style="font-size:18px">${r.eng}</span></h2></div><div class="score">⭐ <span id="points">${score}</span> 分</div></div><div class="steps">${rounds.map((_,i)=>`<div class="step ${i<=stage?'on':''}"></div>`).join('')}</div><p class="sub">${r.intro}</p>${stage===2?`<div class="energy" aria-label="已收集 ${energy} 顆，共3顆能量">${[0,1,2].map(i=>`<span class="gem ${i<energy?'filled':''}">⭐</span>`).join('')}</div>`:''}<section class="panel"><div class="eyebrow">挑戰 ${q+1} / 3</div><div class="scene"><div class="emoji">${item.emoji}</div><div><span class="en" lang="en">${item.en}</span><span class="zh">${item.zh}</span></div></div><div class="options">${item.choices.map((c,i)=>`<button class="option" data-i="${i}"><span class="en" lang="en">${String.fromCharCode(65+i)}. ${c[0]}</span></button>`).join('')}</div><div id="feedback" aria-live="polite" aria-atomic="true"></div></section>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));window.scrollTo({top:0,behavior:'instant'})}
function choose(i){if(answered)return;const item=rounds[stage].questions[q],b=app.querySelector(`[data-i="${i}"]`),fb=document.getElementById('feedback');if(i!==item.good){missed=true;b.classList.add('try');b.disabled=true;tone(false);fb.innerHTML='<div class="feedback">🌤️ Let’s think again. 再想一想。<br>心情不用藏起來。哪一個做法能照顧自己、尊重別人，或幫助你學習？選另一個試試看。</div>';return}answered=true;score+=missed?5:10;if(stage===2)energy++;tone(true);b.classList.add('good');app.querySelectorAll('.option').forEach(x=>x.disabled=true);document.getElementById('points').textContent=score;if(stage===2)app.querySelectorAll('.gem')[energy-1].classList.add('filled');fb.innerHTML=`<div class="feedback">✨ Good thinking! 你找到有幫助的方法了！ <b>+${missed?5:10} 分</b><br>${item.why}</div><button class="primary next" id="next">${q<2?'下一個挑戰 Next →':stage<2?'前往下一關 Next level →':'查看我的能量 Finish →'}</button>`;document.getElementById('next').onclick=()=>{if(q<2){q++;render()}else if(stage<2){stage++;q=0;render()}else finish()}}
function finish(){app.innerHTML=`<section class="panel end"><div class="eyebrow">ADVENTURE COMPLETE · 三關完成</div><div class="medal">🌻</div><h1>你的正向能量，滿格！</h1><p class="sub">You can learn, ask for help, and try again.<br>你能學習、尋求協助，也能再試一次。</p><div class="scorebig">${score} <span style="font-size:20px">/ 90 分</span></div><div class="energy"><span>⭐</span><span>⭐</span><span>⭐</span></div><p class="sub">已收集 3 / 3 顆能量。每次嘗試都值得肯定！</p><div class="cards"><div class="card"><h3>I can name my feeling.</h3><p>我可以說出自己的感受。</p></div><div class="card"><h3>I can ask for help.</h3><p>我可以尋求協助。</p></div><div class="card"><h3>I can try again.</h3><p>我可以再試一次。</p></div></div><div class="note">💬 帶走一個小行動：下次遇到困難，你想找誰幫忙？<br>現在可以和同學或老師分享。難過還在，也沒關係。</div><button class="primary next" id="bonus">玩戳泡泡 Pop bubbles! 🫧</button><br><button class="quiet next" id="again">重玩三關 Play again ↻</button></section>`;document.getElementById('bonus').onclick=bubbleIntro;document.getElementById('again').onclick=home;window.scrollTo({top:0,behavior:'instant'})}

function bubbleIntro(){stopBubbles();app.innerHTML='<section class="panel end"><div class="eyebrow">POP POSITIVE BUBBLES · 30 秒挑戰</div><div class="medal">🫧</div><h1>正向詞語戳泡泡</h1><p class="sub">Pop a bubble. Keep a kind word.<br>戳泡泡，把鼓勵自己的英文短句收進口袋！</p><div class="note">按下開始才倒數 <b>30 秒</b>。泡泡會不規則從天而降！<br>讀一讀，戳<b>正面語句</b>收集 +1，重複也算。<br>也會出現負面想法；戳到<b>不加分，也不扣分</b>，漏接也不扣分。<br>可以用手指、滑鼠，或 Tab 選取後按 Enter。<br>休息與求助，也是正向能量。這是小遊戲，不是英語考試。</div><button class="primary next" id="bubbleStart">開始 30 秒 Start! →</button></section>';document.getElementById('bubbleStart').onclick=startBubbles;window.scrollTo({top:0,behavior:'instant'})}
const negativeBubbles=[{word:'I cannot learn.',hint:'換個想法：I can learn. 我可以慢慢學。'},{word:'I give up.',hint:'先休息也可以。準備好時：I can try again.'},{word:'I am always wrong.',hint:'犯錯不代表你一直都錯。I can practice.'},{word:'I must be perfect.',hint:'不需要完美。需要幫忙時：I can ask for help.'}];
function startBubbles(){stopBubbles();document.body.classList.add('bubble-play');bubbleCount=0;bubbleCollected={};bubbleActive=true;bubbleDeadline=Date.now()+30000;nextBubbleAt=Date.now()+550;app.innerHTML='<section class="panel"><div class="eyebrow">POSITIVE WORDS · 正向詞語收集</div><h2>讀一讀，戳正面泡泡！ 🫧</h2><div class="bubblehud"><div class="score">⏱️ <span id="seconds">30</span> 秒</div><div class="score">🫧 已收集 <span id="bubbleCount">0</span> 顆</div></div><div class="timerbar"><div id="timefill" style="width:100%"></div></div><p class="bubblehint">正面語句 +1 · 負面想法不加分、不扣分 · 漏接也不扣分</p><div class="bubblefield" id="bubblefield" aria-label="從天而降的英文泡泡"><div id="popMessage" aria-live="polite"></div></div></section>';spawnBubble(true);bubbleTimer=setInterval(tickBubbles,50);window.scrollTo({top:0,behavior:'instant'})}
function spawnBubble(forcePositive=false){if(!bubbleActive||falling.length>=7)return;const field=document.getElementById('bubblefield'),positive=forcePositive||Math.random()<.7;const item=positive?{word:bubbleWords[Math.floor(Math.random()*bubbleWords.length)]}:negativeBubbles[Math.floor(Math.random()*negativeBubbles.length)];const width=field.clientWidth||600,height=field.clientHeight||450,size=Math.min(width<420?112:148,width*.44);const x=Math.random()*Math.max(0,width-size),life=6500+Math.random()*4000,b=document.createElement('button');b.className='bubble';b.lang='en';b.textContent=item.word;b.style.setProperty('--size',size+'px');const obj={button:b,item,positive,x,size,born:Date.now(),life,height,phase:Math.random()*6.28,width};b.style.transform='translate('+x+'px,'+(-size)+'px)';b.onclick=()=>popBubble(obj);field.appendChild(b);falling.push(obj)}
function tickBubbles(){if(!bubbleActive)return;const now=Date.now(),remaining=Math.max(0,bubbleDeadline-now);if(remaining===0){bubbleEnd();return}document.getElementById('seconds').textContent=Math.ceil(remaining/1000);document.getElementById('timefill').style.width=(remaining/30000*100)+'%';if(now>=nextBubbleAt){spawnBubble();nextBubbleAt=now+550+Math.random()*750}falling=falling.filter(obj=>{const t=(now-obj.born)/obj.life;if(t>=1){obj.button.remove();return false}const x=Math.max(0,Math.min(obj.width-obj.size,obj.x+Math.sin(t*5+obj.phase)*18)),y=-obj.size+t*(obj.height+obj.size);obj.button.style.transform='translate('+x+'px,'+y+'px)';return true})}
function popBubble(obj){const b=obj.button;if(!bubbleActive||b.disabled)return;if(Date.now()>=bubbleDeadline){bubbleEnd();return}b.disabled=true;b.classList.add('popped');if(obj.positive){bubbleCount++;bubbleCollected[obj.item.word]=(bubbleCollected[obj.item.word]||0)+1;document.getElementById('bubbleCount').textContent=bubbleCount;document.getElementById('popMessage').textContent='✨ '+obj.item.word+' +1';tone(true)}else{document.getElementById('popMessage').textContent='🌤️ 不扣分！這個想法可以轉個彎。'+obj.item.hint;tone(false)}const version=bubbleVersion,message=document.getElementById('popMessage').textContent;setTimeout(()=>{if(bubbleActive&&version===bubbleVersion&&document.getElementById('popMessage').textContent===message)document.getElementById('popMessage').textContent=''},1800);setTimeout(()=>{if(version!==bubbleVersion)return;b.remove();falling=falling.filter(x=>x!==obj)},180)}
function bubbleEnd(){if(!bubbleActive)return;stopBubbles();app.innerHTML='<section class="panel end"><div class="eyebrow">TIME IS UP · 收集完成</div><div class="medal">🫧</div><h1>把這些力量帶走吧！</h1><div class="scorebig">'+bubbleCount+' <span style="font-size:22px">顆正面泡泡</span></div><p class="sub">收集了 '+Object.keys(bubbleCollected).length+' 種鼓勵短句<br>每一點鼓勵都值得留下。難過的時候，也可以休息或找人幫忙。</p><div class="collection">'+Object.entries(bubbleCollected).map(([word,n])=>'<span class="wordchip" lang="en">'+word+' ×'+n+'</span>').join('')+'</div><div class="note">'+(bubbleCount?'💬 選一句喜歡的英文，念給自己或同學聽！':'💛 這次還沒戳到也沒關係。準備好後，可以再玩一次！')+'</div><button class="primary next" id="bubbleAgain">再玩 30 秒 Play again 🫧</button></section>';document.getElementById('bubbleAgain').onclick=bubbleIntro;window.scrollTo({top:0,behavior:'instant'})}
bubbleIntro();</script></body></html>
